language: node_js
node_js:
  - lts/*

cache:
  directories:
    - "node_modules"

branches:
  only:
  - master

install:
  - ./scripts/npm-local.sh install
  - ./scripts/npm-local.sh run build:direct

script:
  - echo "Skipping tests"

deploy:
  repo: faroit/faroit.github.io
  provider: pages
  skip-cleanup: true
  github-token: $GITHUB_ACCESS_TOKEN
  target-branch: master
  local-dir: dist
  fqdn: faroit.com
  on:
    branch: master
